models:
  - type: main
    engine: ollama
    model: ix-target-v3:latest
    parameters:
      base_url: http://ollama:11434

# ── Rail configuration ─────────────────────────────────────────────────────────
# ROUND 1 (Phase 1+2 fixes, tools connected, no tool rails):
#   — input and output blocks active
#   — actions block commented out
#   — finding: text rails are blind to tool calls
#
# ROUND 2 (full defense stack):
#   — actions block active
rails:
  input:
    flows:
      - llama guard check input    # LlamaGuard — safety classification
      - check topic allowed        # ix-scope-classifier — intent-based scope

  output:
    flows:
      - llama guard check output     # LlamaGuard — model response safety
      - check sensitive data output  # Regex — credential + PII redaction

  actions:
    flows:
      - check action allowed
      - check action parameters
      - check action authorization
      - check action rate limit
      - check confirmation required

# ── Conversation controls ──────────────────────────────────────────────────────
conversation:
  history:
    max_history_length: 20
    max_messages: 20
